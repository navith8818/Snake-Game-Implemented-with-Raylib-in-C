name: Build and Deploy Snake Game to Web

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64

      - name: Cache Raylib for Web
        id: cache-raylib
        uses: actions/cache@v4
        with:
          path: raylib
          key: raylib-web-5.0-v9-${{ runner.os }}

      - name: Build Raylib Library for Web (with JPEG & Asyncify Audio Protection)
        if: steps.cache-raylib.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 5.0 https://github.com/raysan5/raylib.git raylib
          # Explicitly enable JPEG decoding in raylib config
          sed -i 's/#define SUPPORT_FILEFORMAT_JPG.*/#define SUPPORT_FILEFORMAT_JPG 1/g' raylib/src/config.h
          # Apply thread-safe audio and sleep patches
          python3 patch_raylib.py
          cd raylib/src
          emmake make PLATFORM=PLATFORM_WEB CUSTOM_CFLAGS="-DSUPPORT_FILEFORMAT_JPG=1" -B

      - name: Sync case sensitivity for resources
        run: |
          # main.c references lowercase extensions: resources/lose.mp3 and resources/FFFFORWA.ttf
          if [ -f "resources/lose.MP3" ]; then cp "resources/lose.MP3" "resources/lose.mp3"; fi
          if [ -f "resources/FFFFORWA.TTF" ]; then cp "resources/FFFFORWA.TTF" "resources/FFFFORWA.ttf"; fi

      - name: Compile Game to WebAssembly (High Performance -O3)
        run: |
          mkdir -p dist
          emcc main.c -o dist/index.html \
            -O3 -Wall \
            -DPLATFORM_WEB \
            -I./raylib/src \
            ./raylib/src/libraylib.a \
            -s USE_GLFW=3 \
            -s ASYNCIFY=1 \
            -s STACK_SIZE=1048576 \
            -s ASYNCIFY_STACK_SIZE=131072 \
            -s ALLOW_MEMORY_GROWTH=1 \
            -s INITIAL_MEMORY=268435456 \
            -s FORCE_FILESYSTEM=1 \
            -s ENVIRONMENT=web \
            --preload-file Graphics \
            --preload-file resources \
            --shell-file minshell.html

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: snake-game-web
          path: dist/

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
