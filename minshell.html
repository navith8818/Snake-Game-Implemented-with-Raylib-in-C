<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake POP</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #0b0c10;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow: hidden;
      }
      #game-container {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      canvas.emscripten {
        border: 2px solid #232733;
        border-radius: 8px;
        background-color: #000;
        display: block;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        outline: none;
      }
      #status-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(11, 12, 16, 0.95);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        border-radius: 8px;
        z-index: 10;
        transition: opacity 0.3s ease;
      }
      .spinner {
        width: 50px;
        height: 50px;
        border: 4px solid #ef3719;
        border-top-color: transparent;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      #status-text {
        font-size: 18px;
        font-weight: 500;
        color: #f1f1f1;
        text-align: center;
        max-width: 80%;
      }
      #progress-bar-container {
        width: 280px;
        height: 8px;
        background-color: #1e222d;
        border-radius: 4px;
        margin-top: 16px;
        overflow: hidden;
        display: none;
      }
      #progress-bar {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, #ef3719, #ff7043);
        transition: width 0.15s ease;
      }
      .controls-hint {
        margin-top: 12px;
        font-size: 13px;
        color: #8b949e;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <div id="status-overlay">
        <div class="spinner" id="spinner"></div>
        <div id="status-text">Loading Snake POP...</div>
        <div id="progress-bar-container">
          <div id="progress-bar"></div>
        </div>
      </div>
      <canvas class="emscripten" id="canvas" width="800" height="600" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
      <div class="controls-hint">Click on game window to focus &amp; enable audio</div>
    </div>

    <script type="text/javascript">
      var statusOverlay = document.getElementById('status-overlay');
      var statusText = document.getElementById('status-text');
      var spinner = document.getElementById('spinner');
      var progressBarContainer = document.getElementById('progress-bar-container');
      var progressBar = document.getElementById('progress-bar');

      var Module = {
        print: function(text) {
          console.log(text);
        },
        printErr: function(text) {
          console.error(text);
        },
        canvas: (function() {
          var canvas = document.getElementById('canvas');
          canvas.addEventListener("webglcontextlost", function(e) {
            alert('WebGL context lost. Please reload the page.');
            e.preventDefault();
          }, false);
          return canvas;
        })(),
        setStatus: function(text) {
          if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
          if (text === Module.setStatus.last.text) return;
          var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
          var now = Date.now();
          if (m && now - Module.setStatus.last.time < 30) return;
          Module.setStatus.last.time = now;
          Module.setStatus.last.text = text;

          if (m) {
            text = m[1];
            var current = parseInt(m[2]);
            var total = parseInt(m[4]);
            var pct = Math.round((current / total) * 100);
            statusText.innerHTML = text + ' (' + pct + '%)';
            progressBarContainer.style.display = 'block';
            progressBar.style.width = pct + '%';
          } else {
            statusText.innerHTML = text;
            if (text === '') {
              progressBarContainer.style.display = 'none';
            }
          }

          if (text === '') {
            statusOverlay.style.opacity = '0';
            setTimeout(function() {
              statusOverlay.style.display = 'none';
            }, 300);
          } else {
            statusOverlay.style.display = 'flex';
            statusOverlay.style.opacity = '1';
          }
        },
        totalDependencies: 0,
        monitorRunDependencies: function(left) {
          this.totalDependencies = Math.max(this.totalDependencies, left);
          Module.setStatus(left ? 'Preparing assets (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')...' : '');
        }
      };

      Module.setStatus('Downloading game data...');

      function handleGlobalError(msg, error) {
        var str = (msg || '').toString();
        // Ignore normal program termination (exit(0), ExitStatus, unwind)
        if ((error && error.name === 'ExitStatus') ||
            str.indexOf('ExitStatus') !== -1 ||
            str.indexOf('unwind') !== -1 ||
            str.indexOf('exit(0)') !== -1) {
          statusOverlay.style.display = 'flex';
          statusOverlay.style.opacity = '1';
          spinner.style.display = 'none';
          progressBarContainer.style.display = 'none';
          statusText.innerHTML = '<div style="font-size: 22px; margin-bottom: 16px; font-weight: 600;">Game Finished</div><button onclick="location.reload()" style="padding: 10px 24px; font-size: 15px; font-weight: 600; background: #ef3719; color: white; border: none; border-radius: 6px; cursor: pointer;">Play Again</button>';
          return true;
        }

        // Intercept and swallow non-fatal audio processor callbacks without stalling gameplay
        if (str.indexOf('ScriptProcessorNode') !== -1 || str.indexOf('onaudioprocess') !== -1) {
          console.warn('Swallowed transient audio callback event during screen transition:', str);
          return true;
        }

        statusOverlay.style.display = 'flex';
        statusOverlay.style.opacity = '1';
        spinner.style.display = 'none';
        progressBarContainer.style.display = 'none';
        var errorDetails = (error && error.stack) ? error.stack : (error && error.message ? error.message : str);
        statusText.innerHTML = '<div style="color: #ef3719; font-size: 18px; font-weight: bold; margin-bottom: 8px;">Error Occurred:</div><div style="font-size: 12px; color: #ffb4a2; word-break: break-all; margin-bottom: 12px; text-align: left; max-height: 180px; overflow: auto; background: #161822; padding: 10px; border-radius: 4px; font-family: monospace;">' + errorDetails + '</div><button onclick="location.reload()" style="padding: 8px 20px; background: #ef3719; color: white; border: none; border-radius: 4px; cursor: pointer;">Reload</button>';
        return false;
      }

      window.onerror = function(msg, url, lineNo, columnNo, error) {
        return handleGlobalError(msg, error);
      };

      window.onunhandledrejection = function(e) {
        var reason = e.reason || '';
        var str = reason.toString();
        if (str.indexOf('ExitStatus') !== -1 || str.indexOf('unwind') !== -1 || str.indexOf('ScriptProcessorNode') !== -1) {
          return;
        }
        handleGlobalError(str, reason);
      };

      // Focus canvas & auto-resume Web Audio on user gesture
      var canvasElem = document.getElementById('canvas');
      function unlockAudio() {
        canvasElem.focus();
        if (typeof window !== 'undefined' && window.miniaudio && window.miniaudio.devices) {
          for (var i = 0; i < window.miniaudio.devices.length; ++i) {
            var dev = window.miniaudio.devices[i];
            if (dev && dev.webaudio && dev.webaudio.state === 'suspended') {
              dev.webaudio.resume();
            }
          }
        }
      }
      canvasElem.addEventListener('click', unlockAudio);
      window.addEventListener('click', unlockAudio);
      window.addEventListener('keydown', unlockAudio);
      window.addEventListener('touchstart', unlockAudio);
    </script>
    {{{ SCRIPT }}}
  </body>
</html>
